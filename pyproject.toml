[project]
name = "bdc2026-stock-ranking"
version = "0.2.0"
description = "Competition-compliant XGBoost stock ranking project for BDC 2026."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "baostock>=0.8.9,<1.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.0,<5.0",
    "scikit-learn>=1.3,<2.0",
    "scipy>=1.11,<2.0",
]

[tool.uv]
package = false
